server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML - never cache, always revalidate
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, public";
        add_header Pragma "no-cache";
    }

    # Vite hashed assets (JS, CSS) - cache aggressively
    # Vite includes content hash in filenames, so these never change
    location ~* /assets/.*\.[0-9a-f]+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifest and other non-hashed assets - cache short term
    location ~* \.(json|webmanifest|txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Service worker - no cache
    location = /service-worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, public";
        add_header Service-Worker-Allowed "/";
    }

    # Icons and images - cache medium term
    location ~* \.(ico|png|gif|jpg|jpeg|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Fonts - cache long term
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback - route all unmatched requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, public";
    }

    # Error pages
    error_page 404 /index.html;
}
