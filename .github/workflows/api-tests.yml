name: API Tests

on:
  pull_request:
    paths:
      - "bribebank-api/**"
      - ".github/workflows/api-tests.yml"
  push:
    paths:
      - "bribebank-api/**"
      - ".github/workflows/api-tests.yml"

jobs:
  test-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bribebank-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bribebank-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bribebank-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bribebank-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build
